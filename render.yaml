services:
  - type: web
    name: smarthome-network-lab
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r server/requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: SMARTHOME_DB_PATH
        value: /var/data/smarthome_lab.db
    disk:
      name: student-data
      mountPath: /var/data
      sizeGB: 1

