<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>30101 답변 매니저</title><style>body{margin:0;background:#07101d;color:#e7f2ff;font-family:system-ui,sans-serif}.wrap{max-width:900px;margin:0 auto;padding:22px}.card{background:#102239;border:1px solid #315477;border-radius:14px;padding:18px;margin:14px 0}h1{margin:.2rem 0;color:#63e0ae}.tag{color:#9fc5ff}.q{font-size:1.2rem;line-height:1.6}.row{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;background:#63e0ae;color:#07101d}button.secondary{background:#294a66;color:#e7f2ff}textarea{width:100%;min-height:130px;box-sizing:border-box;background:#07101d;color:#fff;border:1px solid #315477;border-radius:8px;padding:12px;font:inherit}progress{width:100%;height:16px}.status{color:#63e0ae}.small{font-size:.9rem;color:#b8d5f5}</style></head><body><main class="wrap"><p class="tag">교사용 · STUDENT ANSWER MANAGER</p><h1>30101 답변 매니저</h1><p class="small">학생: 강태유 · 학번: 30101 · 답변과 피드백은 이 브라우저에 자동 저장됩니다.</p><progress id="progress" max="100" value="0"></progress><p id="count" class="status"></p><section class="card"><p id="question" class="q"></p><label>학생 답변<textarea id="answer" placeholder="학생이 말한 내용을 기록하세요."></textarea></label><label>교사 피드백<textarea id="feedback" placeholder="다음 관찰이나 보완점을 적으세요."></textarea></label><div class="row"><button id="save">답변 저장</button><button id="prev" class="secondary">이전</button><button id="next" class="secondary">다음 질문</button><button id="export" class="secondary">기록 내보내기</button></div><p id="status" class="small"></p></section></main><script>
const bases=['라즈베리 파이는 무엇을 하는 장치인가요?','자동차가 앞으로 가려면 어떤 값이 필요한가요?','속도 값이 바뀌면 자동차는 어떻게 달라지나요?','조향 값이 0이면 자동차는 어떻게 움직이나요?','브레이크 값 1은 어떤 상태인가요?','패킷에서 출발지와 목적지는 무엇인가요?','Wireshark에서 이 패킷을 찾으려면 어떤 필터를 쓸까요?','이 기록에서 자동차가 움직였다는 근거는 무엇인가요?','문제가 생겼을 때 가장 먼저 확인할 것은 무엇인가요?','오늘 배운 내용을 한 문장으로 말해 보세요?'];const follow=['화면에서 값 하나를 찾아 말해 보세요.','왜 그런지도 짧게 말해 보세요.','친구에게 설명한다면 어떻게 말할까요?','순서대로 무엇을 확인할지 말해 보세요.','다른 경우에는 어떻게 될지도 생각해 보세요.','프레임 번호를 근거로 말해 보세요.','한 줄로 적은 뒤 말해 보세요.','친구와 함께 확인할 역할을 말해 보세요.','쉬운 말로 다시 설명해 보세요.','다음에 확인할 것을 골라 보세요.'];const questions=Array.from({length:100},(_,i)=>`${bases[i%10]} ${follow[(i+1)%10]}`);const key='30101-answer-manager';const state=JSON.parse(localStorage.getItem(key)||'{"index":0,"items":[]}');const $=id=>document.getElementById(id);function render(){const i=state.index; $('question').textContent=`${i+1}. ${questions[i]}`;$('count').textContent=`질문 ${i+1}/100 · 저장 완료 ${state.items.filter(x=>x.answer||x.feedback).length}개`;$('progress').value=state.items.filter(x=>x.answer||x.feedback).length;$('answer').value=state.items[i]?.answer||'';$('feedback').value=state.items[i]?.feedback||''}function save(){state.items[state.index]={question:questions[state.index],answer:$('answer').value.trim(),feedback:$('feedback').value.trim(),savedAt:new Date().toISOString()};localStorage.setItem(key,JSON.stringify(state));$('status').textContent='30101 답변과 피드백을 저장했습니다.';render()}$('save').onclick=save;$('next').onclick=()=>{save();state.index=Math.min(99,state.index+1);localStorage.setItem(key,JSON.stringify(state));render()};$('prev').onclick=()=>{save();state.index=Math.max(0,state.index-1);localStorage.setItem(key,JSON.stringify(state));render()};$('export').onclick=()=>{const blob=new Blob([JSON.stringify({student_code:'30101',student_name:'강태유',items:state.items},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='30101-answer-log.json';a.click();URL.revokeObjectURL(a.href)};render();</script></body></html>
