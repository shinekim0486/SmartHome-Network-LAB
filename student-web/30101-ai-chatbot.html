<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>30101 알라딘 AI 챗봇</title><style>body{background:#07101d;color:#e7f2ff;font-family:system-ui;margin:0}.wrap{max-width:800px;margin:auto;padding:20px}.card{background:#102239;border:1px solid #315477;border-radius:12px;padding:16px}h1{color:#63e0ae}.q,.ai{padding:14px;border-radius:10px;margin:10px 0;line-height:1.6}.q{background:#142b49}.ai{background:#102a2d;border-left:4px solid #63e0ae}textarea{width:100%;min-height:120px;background:#07101d;color:#fff;border:1px solid #315477;border-radius:8px;padding:10px;box-sizing:border-box}button{margin-top:10px;padding:10px 14px;border:0;border-radius:8px;background:#63e0ae;font-weight:700}</style><main class="wrap"><h1>30101 알라딘 AI 학습 챗봇</h1><p>학생 답변을 입력하면 AI가 쉬운 피드백과 다음 질문을 제공합니다.</p><section class="card"><div id="q" class="q"></div><textarea id="a" placeholder="학생 답변을 입력하세요"></textarea><button id="send">AI에게 답변 보내기</button><div id="ai" class="ai">아직 답변이 없습니다.</div></section></main><script>const qs=['라즈베리 파이는 무엇을 하는 장치인가요?','자동차가 앞으로 가려면 어떤 값이 필요한가요?','속도 값이 바뀌면 자동차는 어떻게 달라지나요?','조향 값이 0이면 자동차는 어떻게 움직이나요?','브레이크 값 1은 어떤 상태인가요?','패킷에서 출발지와 목적지는 무엇인가요?','Wireshark에서 이 패킷을 찾으려면 어떤 필터를 쓸까요?','이 기록에서 자동차가 움직였다는 근거는 무엇인가요?','문제가 생겼을 때 가장 먼저 확인할 것은 무엇인가요?','오늘 배운 내용을 한 문장으로 말해 보세요?'];let i=Number(localStorage.getItem('30101-ai-index')||0);const q=document.querySelector('#q'),a=document.querySelector('#a'),ai=document.querySelector('#ai');function draw(){q.textContent=`질문 ${i+1}/100: ${qs[i%10]}`}function reply(v){const t=v.toLowerCase();if(!v)return'답변을 한 문장으로 적어 보세요. 화면에서 값 하나를 넣어 주세요.';if(/속도|km|가속/.test(t))return'속도 값을 잘 찾았어요. 이전 기록과 비교해 빨라졌는지 확인해 보세요. 다음으로 출발·가속·감속 중 하나를 골라 보세요.';if(/조향|왼쪽|오른쪽|직진/.test(t))return'조향 방향을 관찰했군요. 조향 값의 부호와 자동차 방향을 연결해 보세요. 조향 0과 비교해 볼까요?';if(/브레이크|정지|멈춤/.test(t))return'브레이크와 속도를 함께 보았네요. 두 값을 같이 보면 정지와 감속을 구분할 수 있어요.';if(/패킷|프레임|필터|json|tcp|wireshark/.test(t))return'패킷에서 근거를 찾았어요. 출발지·목적지·시간 중 하나와 프레임 번호를 확인해 보세요.';return'좋은 시도예요. 답변의 중요한 단어를 화면 값이나 패킷과 연결해 보세요. 무엇을 근거로 했나요?'}document.querySelector('#send').onclick=()=>{ai.textContent=reply(a.value.trim());i=Math.min(99,i+1);localStorage.setItem('30101-ai-index',i);a.value='';draw()};draw()</script></html>
